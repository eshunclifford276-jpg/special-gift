<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Question ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758f, #ffb3c6, #ffe5ec);
}

.card {
    width: min(90%, 460px);
    padding: 40px 25px;
    text-align: center;
    background: rgba(255,255,255,0.94);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(130,30,65,0.2);
    position: relative;
    z-index: 2;
    animation: appear 0.8s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.heart {
    font-size: 75px;
    margin-bottom: 15px;
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.2); }
}

h1 {
    color: #d6336c;
    font-size: 30px;
    margin-bottom: 15px;
}

p {
    color: #805060;
    line-height: 1.7;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 35px;
    min-height: 65px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 26px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#yesBtn {
    color: white;
    background: #ff477e;
    box-shadow: 0 5px 18px rgba(255,71,126,0.4);
    transition: transform 0.25s ease;
    position: relative;
    z-index: 3;
}

#yesBtn:hover {
    background: #e93670;
}

#noBtn {
    color: #555;
    background: #eeeeee;
    position: relative;
}

#success {
    display: none;
}

#success h1 {
    font-size: 36px;
}

.floating-heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 1;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.confetti {
    position: fixed;
    top: -40px;
    pointer-events: none;
    z-index: 5;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media (max-width: 450px) {
    .card { padding: 32px 18px; }
    h1 { font-size: 26px; }
}
</style>
</head>

<body>

<div class="card" id="mainCard">
    <div class="heart">❤️</div>

    <h1 id="question">Will you be my girlfriend?</h1>

    <p>
        I've got something special to ask you.
        So, here's my question...
    </p>

    <div class="buttons">
        <button id="yesBtn">YES ❤️</button>
        <button id="noBtn">NO 🙈</button>
    </div>

    <p style="margin-top:25px; font-size:12px;">
        Made with a little courage and a lot of heart.
    </p>
</div>

<div class="card" id="success">
    <div class="heart">💖</div>

    <h1>YOU SAID YES! 🎉</h1>

    <p>
        This moment just became unforgettable.
        Let the celebration begin! ❤️
    </p>

    <p style="margin-top:20px;">
        A new chapter begins... ✨
    </p>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const mainCard = document.getElementById("mainCard");
const success = document.getElementById("success");
const question = document.getElementById("question");

let yesScale = 1;
let noCount = 0;

const messages = [
    "Are you sure? 🥺",
    "Think again! 😂",
    "The YES button is waiting!",
    "You can't catch me! 🙈",
    "Come onnn! ❤️",
    "That NO isn't convincing!",
    "You're making this difficult! 😭"
];

function moveNoButton() {
    noCount++;

    const maxX = Math.max(10, window.innerWidth - noBtn.offsetWidth - 20);
    const maxY = Math.max(10, window.innerHeight - noBtn.offsetHeight - 20);

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    yesScale = Math.min(yesScale + 0.12, 2.5);
    yesBtn.style.transform = "scale(" + yesScale + ")";

    question.textContent = messages[(noCount - 1) % messages.length];
}

noBtn.addEventListener("pointerenter", moveNoButton);
noBtn.addEventListener("click", moveNoButton);

yesBtn.addEventListener("click", function() {
    mainCard.style.display = "none";
    success.style.display = "block";

    makeConfetti();
});

function makeConfetti() {
    const pieces = ["❤️", "💖", "💕", "✨", "🎉", "🌸"];

    for (let i = 0; i < 120; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.fontSize = (15 + Math.random() * 25) + "px";
        piece.style.animationDuration = (2 + Math.random() * 3) + "s";

        document.body.appendChild(piece);

        setTimeout(function() {
            piece.remove();
        }, 5500);
    }
}

function makeFloatingHeart() {
    const heart = document.createElement("div");
    const choices = ["❤️", "💕", "💗", "💖", "🌸"];

    heart.className = "floating-heart";
    heart.textContent = choices[Math.floor(Math.random() * choices.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 20) + "px";
    heart.style.animationDuration = (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, 10000);
}

setInterval(makeFloatingHeart, 500);
</script>

</body>
</html>
